<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Glouton</title></head>
<body>
<script src="../commun/arcade.js"></script>
<script>
'use strict';
// ============================================================
//  GLOUTON — dans l'esprit de Pac-Man (1980)
//  Labyrinthe 28x31 cases de 8 px, 4 fantômes avec leurs IA
//  (chasse / dispersion / peur), pastilles, fruits, tunnel.
//  À 2 joueurs : deux gloutons en même temps dans le labyrinthe.
// ============================================================
const A = Arcade, W = 224, H = 288, MY = 24;
const MAZE = [
  '############################',
  '#............##............#',
  '#.####.#####.##.#####.####.#',
  '#o####.#####.##.#####.####o#',
  '#.####.#####.##.#####.####.#',
  '#..........................#',
  '#.####.##.########.##.####.#',
  '#.####.##.########.##.####.#',
  '#......##....##....##......#',
  '######.##### ## #####.######',
  '     #.##### ## #####.#     ',
  '     #.##          ##.#     ',
  '     #.## ###--### ##.#     ',
  '######.## #      # ##.######',
  '      .   #      #   .      ',
  '######.## #      # ##.######',
  '     #.## ######## ##.#     ',
  '     #.##          ##.#     ',
  '     #.## ######## ##.#     ',
  '######.## ######## ##.######',
  '#............##............#',
  '#.####.#####.##.#####.####.#',
  '#.####.#####.##.#####.####.#',
  '#o..##.......  .......##..o#',
  '###.##.##.########.##.##.###',
  '###.##.##.########.##.##.###',
  '#......##....##....##......#',
  '#.##########.##.##########.#',
  '#.##########.##.##########.#',
  '#..........................#',
  '############################'
];
const DX = [0, -1, 0, 1], DY = [-1, 0, 1, 0];   // haut, gauche, bas, droite
const PACCOL = ['#ffff00', '#80ff40'];
const GCOL = ['#ff0000', '#ffb8ff', '#00ffff', '#ffb852'];
const SCAT = [[25, -3], [2, -3], [27, 31], [0, 31]];
const FRIGHT = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];

// ---------- Dessin du labyrinthe (contours bleus arrondis) ----------
function buildMaze(col) {
  const isWall = (tx, ty) => (tx < 0 || tx > 27 || ty < 0 || ty > 30) ? ty !== 14 : MAZE[ty][tx] === '#';
  const Wd = 224, Hd = 248, M = new Uint8Array(Wd * Hd);
  for (let py = 0; py < Hd; py++) for (let px = 0; px < Wd; px++) {
    const tx = px >> 3, ty = py >> 3; if (!isWall(tx, ty)) continue;
    let ok = 1;
    for (let dy = -1; dy <= 1 && ok; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (isWall(tx + dx, ty + dy)) continue;
      const rx = (tx + dx) * 8, ry = (ty + dy) * 8, cx = px + .5, cy = py + .5;
      const ddx = Math.max(rx - cx, 0, cx - rx - 8), ddy = Math.max(ry - cy, 0, cy - ry - 8);
      if (ddx * ddx + ddy * ddy < 6.5) { ok = 0; break; }
    }
    M[py * Wd + px] = ok;
  }
  const c = document.createElement('canvas'); c.width = Wd; c.height = Hd;
  const g = c.getContext('2d'); g.fillStyle = col;
  const at = (x, y) => (x < 0 || y < 0 || x >= Wd || y >= Hd) ? 1 : M[y * Wd + x];
  for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++)
    if (M[y * Wd + x] && (!at(x - 1, y) || !at(x + 1, y) || !at(x, y - 1) || !at(x, y + 1))) g.fillRect(x, y, 1, 1);
  return c;
}
let MAZE_B, MAZE_W;

// ---------- Sprites ----------
const pacCache = new Map();
function pacSpr(dir, open, col) {
  const k = dir + '|' + open.toFixed(2) + col; let c = pacCache.get(k); if (c) return c;
  c = document.createElement('canvas'); c.width = 15; c.height = 15; const g = c.getContext('2d'); g.fillStyle = col;
  const da = [-Math.PI / 2, Math.PI, Math.PI / 2, 0][dir];
  for (let y = 0; y < 15; y++) for (let x = 0; x < 15; x++) {
    const ox = x + .5 - 7.5, oy = y + .5 - 7.5;
    if (ox * ox + oy * oy > 46) continue;
    let d = Math.abs(Math.atan2(oy, ox) - da); if (d > Math.PI) d = 2 * Math.PI - d;
    if (d < open) continue;
    g.fillRect(x, y, 1, 1);
  }
  pacCache.set(k, c); return c;
}
const S = s => s.split('|');
const GBODY = [S('.....####.....|...########...|..##########..|.############.|.############.|.############.|##############|##############|##############|##############|##############|##############|##############|##.###..###.##'),
               S('.....####.....|...########...|..##########..|.############.|.############.|.############.|##############|##############|##############|##############|##############|##############|##############|#..##.##.##..#')];
const bodies = {};
function body(col, f) { const k = col + f; return bodies[k] || (bodies[k] = A.sprite(GBODY[f], { '#': col })); }
const FACE = A.sprite(S('..............|..............|..............|..............|..............|....##..##....|....##..##....|..............|..............|..#.#.#.#.#...|.#.#.#.#.#.#..'), { '#': '#ffb8b8' });
const FACE_W = A.recolor(FACE, '#ff2020');
const FRUIT = [
  A.sprite(S('.......GG.|......G.G.|.....G..G.|....G...G.|.RRR...G..|RRWRR.RRR.|RRRRRRRWRR|RRRRRRRRRR|.RRR.RRRR.|......RR..'), { R: '#ff0000', G: '#a06030', W: '#fff' }),
  A.sprite(S('...GGGG...|..GGGGGG..|.RRRRRRRR.|RRWRRRWRRR|RRRRWRRRRR|RWRRRRRWRR|.RRRWRRRR.|.RRRRRRR..|..RRWRR...|...RRR....'), { R: '#ff2020', G: '#30d030', W: '#fff' }),
  A.sprite(S('....GG....|...GG.....|..OOOOOO..|.OOOOOOOO.|OOOOOOOOOO|OOOOOOOOOO|OOOOOOOOOO|OOOOOOOOOO|.OOOOOOOO.|..OOOOOO..'), { O: '#ffa030', G: '#30d030' }),
  A.sprite(S('....B.....|.RRRBRRR..|RRRRRRRRR.|RWRRRRRRRR|RWRRRRRRRR|RRRRRRRRRR|RRRRRRRRRR|.RRRRRRRR.|..RRRRRR..|...RR.RR..'), { R: '#e00010', B: '#a06030', W: '#fff' }),
  A.sprite(S('....GG....|..LLLLLL..|.LDLLDLLL.|LLLLDLLDLL|LDLLLLDLLL|LLLDLLLLDL|LDLLLDLLLL|.LLDLLLDL.|..LLLLLL..|..........'), { L: '#30d030', D: '#106010', G: '#a06030' })
];
const FRUIT_PTS = [100, 300, 500, 700, 1000, 2000, 3000, 5000];

// ---------- Monde ----------
let w;
const tile = (tx, ty) => (ty < 0 || ty > 30) ? '#' : (tx < 0 || tx > 27) ? (ty === 14 ? ' ' : '#') : w.grid[ty][tx];
const walk = (tx, ty) => { const c = tile(tx, ty); return c !== '#' && c !== '-'; };
const center = v => ((v - 4) % 8 + 8) % 8 === 0;
const lv = (arr) => arr[Math.min(w.level - 1, arr.length - 1)];

function init(n) {
  w = { level: 1, t: 0, pacs: [], pops: [], first: true };
  for (let i = 0; i < n; i++) w.pacs.push({ pid: i, out: false });
  newLevel();
  return w;
}
function newLevel() {
  w.grid = MAZE.map(r => r.split(''));
  w.dotsLeft = 0; w.dotsEaten = 0;
  for (const r of w.grid) for (const c of r) if (c === '.' || c === 'o') w.dotsLeft++;
  w.fruit = null;
  resetPositions();
}
function resetPositions() {
  w.pacs.forEach((p, i) => Object.assign(p, { x: 112, y: 188, dir: i ? 3 : 1, want: null, acc: 0, anim: 0 }));
  const homes = [[112, 92], [112, 116], [96, 116], [128, 116]], rel = w.level === 1 ? [0, .5, 4, 8] : [0, .5, 2, 4];
  w.ghosts = GCOL.map((col, id) => ({ id, col, x: homes[id][0], y: homes[id][1], dir: 1, acc: 0, bob: 1,
    mode: id ? 'house' : 'active', fright: false, rev: false, relT: rel[id] }));
  w.modeIdx = 0; w.modeT = 0; w.scatter = true; w.frightT = 0; w.chain = 0; w.freeze = 0;
  w.phase = 'ready'; w.timer = w.first ? 3.5 : 2; w.first = false;
}
const SCHED1 = [7, 20, 7, 20, 5, 20, 5, Infinity], SCHED2 = [5, 20, 5, 20, 5, 1000, .02, Infinity];

function update(_, dt) {
  w.t += dt;
  w.pops.forEach(p => p.t -= dt); w.pops = w.pops.filter(p => p.t > 0);
  if (w.phase === 'ready') { if ((w.timer -= dt) <= 0) w.phase = 'play'; return; }
  if (w.phase === 'clear') { if ((w.timer -= dt) <= 0) { w.level++; newLevel(); } return; }
  if (w.phase === 'dying') {
    if ((w.timer -= dt) <= 0) {
      const p = w.pacs[w.dyingPid];
      if (!A.die(p.pid)) p.out = true;
      if (w.pacs.some(q => !q.out)) resetPositions();
    }
    return;
  }
  if (w.freeze > 0) { w.freeze -= dt; return; }
  // sirène
  if (w.ghosts.some(g => g.mode === 'eyes')) A.hum('siren', 1100 + Math.sin(w.t * 30) * 300, 'square', .02);
  else if (w.frightT > 0) A.hum('siren', 180 + (w.t * 6 % 1) * 260, 'square', .025);
  else A.hum('siren', 330 + Math.abs(Math.sin(w.t * 2.6)) * 160, 'triangle', .05);
  // horloge dispersion / chasse
  if (w.frightT > 0) {
    if ((w.frightT -= dt) <= 0) w.ghosts.forEach(g => g.fright = false);
  } else {
    const sched = w.level === 1 ? SCHED1 : SCHED2;
    if ((w.modeT += dt) >= sched[w.modeIdx]) {
      w.modeT = 0; w.modeIdx++; w.scatter = w.modeIdx % 2 === 0;
      w.ghosts.forEach(g => { if (g.mode === 'active') g.rev = true; });
    }
  }
  const base = 75.75;
  for (const p of w.pacs) {
    if (p.out) continue;
    const i = A.input(p.pid);
    if (i.up) p.want = 0; else if (i.down) p.want = 2; else if (i.left) p.want = 1; else if (i.right) p.want = 3;
    p.acc += base * (w.frightT > 0 ? lv([.9, .95, .95, .95, 1]) : lv([.8, .9, .9, .9, 1])) * dt;
    while (p.acc >= 1) { p.acc--; stepPac(p); if (w.phase !== 'play') return; }
  }
  for (const g of w.ghosts) {
    if (g.mode === 'house' && (g.relT -= dt) <= 0) g.mode = 'leave';
    let sp = lv([.75, .85, .85, .85, .95]);
    const ty = Math.floor(g.y / 8), tx = Math.floor(g.x / 8);
    if (g.mode === 'eyes') sp = 1.6;
    else if (g.mode === 'active' && ty === 14 && (tx < 6 || tx > 21)) sp = lv([.4, .45, .45, .45, .5]);
    else if (g.fright) sp = lv([.5, .55, .55, .55, .6]);
    else if (g.mode !== 'active') sp = .5;
    g.acc += base * sp * dt;
    while (g.acc >= 1) { g.acc--; stepGhost(g); }
  }
  collide();
  if (w.fruit && (w.fruit.t -= dt) <= 0) w.fruit = null;
}
function wrap(e) { if (e.x < -12) e.x += 240; else if (e.x > 236) e.x -= 240; }
function stepPac(p) {
  if (p.want != null && p.want === (p.dir + 2) % 4) p.dir = p.want;
  if (center(p.x) && center(p.y)) {
    const tx = (p.x - 4) / 8, ty = (p.y - 4) / 8;
    eat(p, tx, ty); if (w.phase !== 'play') return;
    if (p.want != null && walk(tx + DX[p.want], ty + DY[p.want])) p.dir = p.want;
    if (!walk(tx + DX[p.dir], ty + DY[p.dir])) return;
  }
  p.x += DX[p.dir]; p.y += DY[p.dir]; wrap(p); p.anim++;
}
function eat(p, tx, ty) {
  if (tx < 0 || tx > 27) return;
  const c = w.grid[ty][tx];
  if (c !== '.' && c !== 'o') return;
  w.grid[ty][tx] = ' '; w.dotsLeft--; w.dotsEaten++;
  if (c === '.') { A.addScore(p.pid, 10); A.tone(w.waka ^= 1 ? 520 : 390, .07, 'triangle', .08); }
  else {
    A.addScore(p.pid, 50); A.tone(300, .15, 'square', .06, 300);
    const d = lv(FRIGHT); w.chain = 0;
    w.ghosts.forEach(g => { if (g.mode === 'active') g.rev = true; if (d && g.mode !== 'eyes') g.fright = true; });
    w.frightT = d;
  }
  if (w.dotsEaten === 70 || w.dotsEaten === 170) w.fruit = { t: A.rand(9, 10), k: Math.min(w.level - 1, 7) };
  if (w.dotsLeft <= 0) { w.phase = 'clear'; w.timer = 2.4; A.jingle('bonus'); }
}
function target(g) {
  if (g.mode === 'eyes') return [13, 11];
  if (w.scatter) return SCAT[g.id];
  let p = null, best = 1e9;
  for (const q of w.pacs) if (!q.out) { const d = (q.x - g.x) ** 2 + (q.y - g.y) ** 2; if (d < best) { best = d; p = q; } }
  if (!p) return SCAT[g.id];
  const px = Math.floor(p.x / 8), py = Math.floor(p.y / 8), gx = Math.floor(g.x / 8), gy = Math.floor(g.y / 8);
  switch (g.id) {
    case 0: return [px, py];
    case 1: return [px + 4 * DX[p.dir], py + 4 * DY[p.dir]];
    case 2: { const b = w.ghosts[0], ax = px + 2 * DX[p.dir], ay = py + 2 * DY[p.dir];
              return [2 * ax - Math.floor(b.x / 8), 2 * ay - Math.floor(b.y / 8)]; }
    default: return (px - gx) ** 2 + (py - gy) ** 2 > 64 ? [px, py] : SCAT[3];
  }
}
function stepGhost(g) {
  if (g.mode === 'house') { g.y += g.bob; if (g.y <= 112 || g.y >= 120) g.bob = -g.bob; return; }
  if (g.mode === 'leave') { if (g.x !== 112) g.x += Math.sign(112 - g.x); else if (g.y > 92) g.y--; else { g.mode = 'active'; g.dir = 1; } return; }
  if (g.mode === 'enter') { if (g.y < 116) g.y++; else { g.mode = 'leave'; g.fright = false; } return; }
  if (center(g.x) && center(g.y)) {
    const tx = (g.x - 4) / 8, ty = (g.y - 4) / 8;
    if (g.mode === 'eyes' && ty === 11 && (tx === 13 || tx === 14)) { g.x = 112; g.mode = 'enter'; return; }
    if (g.rev) { g.dir = (g.dir + 2) % 4; g.rev = false; }
    else {
      const opts = [0, 1, 2, 3].filter(d => d !== (g.dir + 2) % 4 && walk(tx + DX[d], ty + DY[d]));
      if (!opts.length) g.dir = (g.dir + 2) % 4;
      else if (g.fright && g.mode === 'active') g.dir = A.pick(opts);
      else {
        const [ttx, tty] = target(g); let bd = 1e9;
        for (const d of opts) { const dd = (tx + DX[d] - ttx) ** 2 + (ty + DY[d] - tty) ** 2; if (dd < bd) { bd = dd; g.dir = d; } }
      }
    }
  } else if (g.rev) { g.dir = (g.dir + 2) % 4; g.rev = false; }
  g.x += DX[g.dir]; g.y += DY[g.dir]; wrap(g);
}
function collide() {
  for (const p of w.pacs) {
    if (p.out) continue;
    for (const g of w.ghosts) {
      if (g.mode === 'eyes' || g.mode === 'enter') continue;
      if (Math.abs(p.x - g.x) >= 6 || Math.abs(p.y - g.y) >= 6) continue;
      if (g.fright) {
        const pts = 200 * 2 ** Math.min(w.chain++, 3);
        A.addScore(p.pid, pts); w.pops.push({ x: g.x, y: g.y, s: pts, t: 1, c: '#30e0ff' });
        g.mode = 'eyes'; g.fright = false; w.freeze = .7; A.tone(200, .5, 'square', .07, 1400);
      } else if (g.mode === 'active') {
        w.phase = 'dying'; w.dyingPid = p.pid; w.timer = 2.2; w.dieT = 0;
        A.melody([[988,1],[932,1],[880,1],[831,1],[784,1],[740,1],[698,1],[659,1],[523,2],[392,2]], .1, 'triangle', .1);
        return;
      }
    }
    if (w.fruit && Math.abs(p.x - 112) < 7 && Math.abs(p.y - 140) < 6) {
      const pts = FRUIT_PTS[w.fruit.k]; A.addScore(p.pid, pts);
      w.pops.push({ x: 112, y: 140, s: pts, t: 1.5, c: '#ffb8ff' }); w.fruit = null; A.tone(800, .2, 'square', .07, 600);
    }
  }
}

// ---------- Rendu ----------
function drawGhost(g) {
  const x = Math.round(g.x - 7), y = Math.round(g.y + MY - 7), f = Math.floor(w.t * 8) % 2, ctx = A.ctx;
  if (g.mode !== 'eyes') {
    if (g.fright) {
      const flash = w.frightT < 2 && Math.floor(w.t * 5) % 2;
      A.draw(body(flash ? '#ffffff' : '#2121ff', f), x, y); A.draw(flash ? FACE_W : FACE, x, y);
      return;
    }
    A.draw(body(g.col, f), x, y);
  }
  const pp = [[1, 0], [0, 2], [1, 3], [2, 2]][g.dir];
  for (const ex of [2, 8]) {
    ctx.fillStyle = '#fff'; ctx.fillRect(x + ex, y + 3, 4, 5); ctx.fillRect(x + ex - (ex === 2 ? 0 : 0), y + 4, 4, 3);
    ctx.fillStyle = '#2121ff'; ctx.fillRect(x + ex + pp[0], y + 3 + pp[1], 2, 2);
  }
}
function draw() {
  const ctx = A.ctx;
  if (!MAZE_B) { MAZE_B = buildMaze('#2121ff'); MAZE_W = buildMaze('#ffffff'); }
  ctx.drawImage(w.phase === 'clear' && w.timer < 1.8 && Math.floor(w.t * 5) % 2 ? MAZE_W : MAZE_B, 0, MY);
  ctx.fillStyle = '#ffb8de'; ctx.fillRect(104, MY + 99, 16, 2);
  const blink = Math.floor(w.t * 4) % 2 || w.phase !== 'play';
  for (let ty = 0; ty < 31; ty++) for (let tx = 0; tx < 28; tx++) {
    const c = w.grid[ty][tx];
    if (c === '.') { ctx.fillStyle = '#ffb897'; ctx.fillRect(tx * 8 + 3, MY + ty * 8 + 3, 2, 2); }
    else if (c === 'o' && blink) { ctx.fillStyle = '#ffb897'; ctx.fillRect(tx * 8 + 1, MY + ty * 8 + 2, 6, 4); ctx.fillRect(tx * 8 + 2, MY + ty * 8 + 1, 4, 6); }
  }
  if (w.fruit) A.drawC(FRUIT[Math.min(w.fruit.k, 4)], 112, 140 + MY);
  const dying = w.phase === 'dying';
  if (w.phase !== 'clear' && !(dying && w.timer < 1.6)) for (const g of w.ghosts) drawGhost(g);
  for (const p of w.pacs) {
    if (p.out) continue;
    let spr;
    if (dying && p.pid === w.dyingPid) {
      if (w.timer > 1.6) spr = pacSpr(p.dir, .2, PACCOL[p.pid]);
      else { const k = 1 - w.timer / 1.6; if (k > .95) continue; spr = pacSpr(0, .05 + k * Math.PI, PACCOL[p.pid]); }
    } else if (w.phase === 'ready') spr = pacSpr(p.dir, 0, PACCOL[p.pid]);
    else spr = pacSpr(p.dir, [0, .35, .75, .35][Math.floor(p.anim / 3) % 4], PACCOL[p.pid]);
    A.drawC(spr, p.x, p.y + MY);
  }
  for (const p of w.pops) A.text(p.s, p.x, p.y + MY - 3, p.c, 1, 'center');
  if (w.phase === 'ready') {
    if (A.n === 2 && w.timer > 2) A.text('2 JOUEURS !', 112, 108 + MY, '#00ffff', 1, 'center');
    A.text('READY!', 112, 137 + MY, '#ffff00', 1, 'center');
  }
  A.players.forEach((pl, i) => {
    for (let k = 0; k < Math.min(pl.lives - 1, 4); k++) A.draw(pacSpr(1, .6, PACCOL[i]), i ? W - 20 - k * 16 : 6 + k * 16, H - 15);
  });
  for (let k = 0; k < Math.min(w.level, 4); k++) A.draw(FRUIT[Math.min(w.level - 1 - k, 4)], W / 2 + 14 - k * 12, H - 13);
}
function attract(ctx, t, y) {
  A.text('PERSONNAGE / SURNOM', W / 2, y + 6, '#fff', 1, 'center');
  const names = [['FLAMBEUR', 'ROUGE'], ['MALIN', 'ROSE'], ['TIMIDE', 'CYAN'], ['LAMBIN', 'ORANGE']];
  names.forEach(([n, c], i) => {
    const yy = y + 22 + i * 16; A.draw(body(GCOL[i], 0), 40, yy - 3);
    A.text('-' + n, 62, yy, GCOL[i]); A.text('"' + c + '"', 150, yy, GCOL[i]);
  });
  const x = (t * 50) % (W + 60) - 30;
  A.drawC(pacSpr(3, [0, .35, .75, .35][Math.floor(t * 12) % 4], '#ff0'), x, y + 96);
  for (let k = 0; k < 4; k++) if (x < 40 + k * 44) { ctx.fillStyle = '#ffb897'; ctx.fillRect(40 + k * 44, y + 95, 2, 2); }
}
A.run({
  id: 'glouton', title: 'GLOUTON', sub: '- LE MANGEUR DE PASTILLES -', lives: 3, bonus: 10000,
  logoColors: ['#fff8a0','#ffff40','#ffe000','#ffc800','#ffa800','#ff8800','#c86000','#402000'],
  help: () => ['J1: FLECHES', 'J2: ' + ['KeyR', 'KeyF', 'KeyD', 'KeyG'].map(A.lab).join(' ')],
  init, update, draw, attract
});
</script>
</body>
</html>
