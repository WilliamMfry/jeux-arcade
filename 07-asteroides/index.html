<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Asteroides</title></head>
<body>
<script src="../commun/arcade.js"></script>
<script>
'use strict';
// ============================================================
//  ASTÉROÏDES — dans l'esprit d'Asteroids (1979), graphismes vectoriels
//  Rotation, poussée, inertie, hyperespace, soucoupes volantes.
// ============================================================
const A = Arcade, W = 320, H = 240;
const COLS = ['#ffffff', '#60ffe0'];
const SHIP = [[11, 0], [-7, -6], [-4, 0], [-7, 6]];
const SIZES = { 3: { r: 18, pts: 20, sp: 35 }, 2: { r: 10, pts: 50, sp: 55 }, 1: { r: 5, pts: 100, sp: 85 } };

let w;
const wrap = o => { o.x = (o.x + W) % W; o.y = (o.y + H) % H; };
function rock(x, y, size) {
  const a = Math.random() * Math.PI * 2, sp = SIZES[size].sp * A.rand(.5, 1.2) * (1 + w.wave * .05);
  const n = 10, shape = Array.from({ length: n }, (_, k) => { const an = k / n * Math.PI * 2, rr = SIZES[size].r * A.rand(.7, 1.1); return [Math.cos(an) * rr, Math.sin(an) * rr]; });
  return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size, r: SIZES[size].r, shape, rot: A.rand(-1, 1), ang: 0 };
}
function init(n) {
  w = { t: 0, wave: 0, ships: [], rocks: [], bul: [], debris: [], parts: [], saucer: null, sauT: 12, sbul: [], beatT: 1, beat: 0 };
  for (let i = 0; i < n; i++) w.ships.push({ pid: i, home: n === 1 ? W / 2 : W / 2 + (i ? 30 : -30), st: 'wait', t: .1, ang: -Math.PI / 2 });
  nextWave();
  return w;
}
function nextWave() {
  w.wave++; w.beatT = 1; w.waveT = 0;
  const n = Math.min(4 + (w.wave - 1) * 2, 11);
  for (let k = 0; k < n; k++) {
    const edge = Math.random() < .5;
    w.rocks.push(rock(edge ? 0 : A.rand(0, W), edge ? A.rand(0, H) : 0, 3));
  }
}
function spawnShip(s) { Object.assign(s, { st: 'ok', x: s.home, y: H / 2 + 10, vx: 0, vy: 0, ang: -Math.PI / 2, inv: 1.5, thrust: false }); }
function safe(x, y) { return w.rocks.every(r => Math.hypot(r.x - x, r.y - y) > r.r + 40); }

function update(_, dt) {
  w.t += dt; w.waveT += dt; A.updParts(w.parts, dt);
  for (const d of w.debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt; d.l -= dt; }
  w.debris = w.debris.filter(d => d.l > 0);
  // battement de fond qui accélère
  if ((w.beatT -= dt) <= 0) { w.beatT = Math.max(.22, 1 - w.waveT * .02); A.tone(w.beat++ % 2 ? 55 : 62, .12, 'square', .12); }
  for (const s of w.ships) updShip(s, dt);
  for (const r of w.rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.ang += r.rot * dt; wrap(r); }
  for (const b of w.bul) { b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; wrap(b); }
  for (const b of w.sbul) { b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; wrap(b); }
  updSaucer(dt);
  // collisions tirs / rochers / soucoupe
  for (const b of w.bul) {
    if (b.l <= 0) continue;
    for (const r of w.rocks) if (!r.dead && Math.hypot(b.x - r.x, b.y - r.y) < r.r) { b.l = 0; split(r, b.pid); break; }
    const u = w.saucer;
    if (b.l > 0 && u && Math.hypot(b.x - u.x, b.y - u.y) < u.r) { b.l = 0; killSaucer(b.pid); }
  }
  for (const s of w.ships) {
    if (s.st !== 'ok' || s.inv > 0) continue;
    for (const r of w.rocks) if (!r.dead && Math.hypot(s.x - r.x, s.y - r.y) < r.r + 5) { split(r, s.pid); boom(s); break; }
    if (s.st !== 'ok') continue;
    for (const b of w.sbul) if (b.l > 0 && Math.hypot(s.x - b.x, s.y - b.y) < 6) { b.l = 0; boom(s); break; }
    if (s.st === 'ok' && w.saucer && Math.hypot(s.x - w.saucer.x, s.y - w.saucer.y) < w.saucer.r + 5) { killSaucer(s.pid); boom(s); }
  }
  if (w.saucer) for (const r of w.rocks) if (!r.dead && Math.hypot(w.saucer.x - r.x, w.saucer.y - r.y) < r.r + w.saucer.r) { split(r, -1); killSaucer(-1); break; }
  w.rocks = w.rocks.filter(r => !r.dead); w.bul = w.bul.filter(b => b.l > 0); w.sbul = w.sbul.filter(b => b.l > 0);
  if (!w.rocks.length) { if (w.nextT == null) w.nextT = 2.5; if ((w.nextT -= dt) <= 0) { w.nextT = null; nextWave(); } }
}
function split(r, pid) {
  r.dead = true;
  if (pid >= 0) A.addScore(pid, SIZES[r.size].pts);
  A.burst(w.parts, r.x, r.y, ['#fff'], 10 + r.size * 4, 60, .7);
  A.noise(.2 + r.size * .15, .2, 400 + r.size * 300, -300);
  if (r.size > 1) for (let k = 0; k < 2; k++) w.rocks.push(rock(r.x, r.y, r.size - 1));
}
function boom(s) {
  s.st = 'boom'; s.t = 2;
  const pts = SHIP.map(([x, y]) => [x * Math.cos(s.ang) - y * Math.sin(s.ang), x * Math.sin(s.ang) + y * Math.cos(s.ang)]);
  for (let k = 0; k < 4; k++) {
    const a = pts[k], b = pts[(k + 1) % 4], an = Math.random() * Math.PI * 2;
    w.debris.push({ x: s.x + (a[0] + b[0]) / 2, y: s.y + (a[1] + b[1]) / 2, dx: (b[0] - a[0]) / 2, dy: (b[1] - a[1]) / 2, vx: s.vx * .3 + Math.cos(an) * 25, vy: s.vy * .3 + Math.sin(an) * 25, a: 0, va: A.rand(-3, 3), l: 2, c: COLS[s.pid] });
  }
  A.noise(1, .3, 800, -600);
}
function updShip(s, dt) {
  if (s.st === 'boom') { if ((s.t -= dt) <= 0) { s.st = A.die(s.pid) ? 'wait' : 'out'; s.t = 1; } return; }
  if (s.st === 'wait') { if ((s.t -= dt) <= 0 && safe(s.home, H / 2 + 10)) spawnShip(s); return; }
  if (s.st === 'hyper') { if ((s.t -= dt) <= 0) { s.st = 'ok'; if (Math.random() < .1) boom(s); } return; }
  if (s.st !== 'ok') return;
  const i = A.input(s.pid);
  s.inv = Math.max(0, s.inv - dt);
  s.ang += ((i.right ? 1 : 0) - (i.left ? 1 : 0)) * 4.6 * dt;
  s.thrust = i.up;
  if (i.up) { s.vx += Math.cos(s.ang) * 210 * dt; s.vy += Math.sin(s.ang) * 210 * dt; A.hum('thrust' + s.pid, 70 + Math.random() * 20, 'sawtooth', .04); }
  const sp = Math.hypot(s.vx, s.vy); if (sp > 230) { s.vx *= 230 / sp; s.vy *= 230 / sp; }
  const f = Math.pow(.55, dt); s.vx *= f; s.vy *= f;
  s.x += s.vx * dt; s.y += s.vy * dt; wrap(s);
  if (i.aP && w.bul.filter(b => b.pid === s.pid).length < 4) {
    w.bul.push({ pid: s.pid, x: s.x + Math.cos(s.ang) * 11, y: s.y + Math.sin(s.ang) * 11, vx: s.vx + Math.cos(s.ang) * 300, vy: s.vy + Math.sin(s.ang) * 300, l: .85 });
    A.tone(1200, .08, 'square', .05, -900);
  }
  if (i.bP || i.downP) { s.st = 'hyper'; s.t = .6; s.x = A.rand(20, W - 20); s.y = A.rand(30, H - 20); s.vx = s.vy = 0; A.tone(400, .3, 'sine', .08, 800); }
}
function updSaucer(dt) {
  const u = w.saucer;
  if (!u) {
    if ((w.sauT -= dt) <= 0 && w.ships.some(s => s.st === 'ok')) {
      const best = Math.max(...A.players.map(p => p.score)), small = Math.random() < (best > 10000 ? .7 : .25);
      const dir = Math.random() < .5 ? 1 : -1;
      w.saucer = { x: dir > 0 ? 0 : W - 1, y: A.rand(40, H - 30), vx: dir * (small ? 80 : 55), vy: 0, small, r: small ? 6 : 11, fireT: 1, turnT: 1.5, life: W / (small ? 80 : 55) };
    }
    return;
  }
  A.hum('saucer', (u.small ? 900 : 500) + Math.sin(w.t * 25) * 80, 'square', .02);
  u.x += u.vx * dt; u.y += u.vy * dt; u.y = (u.y + H) % H; u.life -= dt;
  if ((u.turnT -= dt) <= 0) { u.turnT = A.rand(1, 2); u.vy = A.pick([-1, 0, 1]) * 40; }
  if ((u.fireT -= dt) <= 0) {
    u.fireT = u.small ? .9 : 1.3;
    let a = Math.random() * Math.PI * 2;
    const tg = w.ships.filter(s => s.st === 'ok');
    if (u.small && tg.length) { const t = A.pick(tg); a = Math.atan2(t.y - u.y, t.x - u.x) + A.rand(-.15, .15); }
    w.sbul.push({ x: u.x, y: u.y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, l: 1 });
    A.tone(700, .06, 'square', .04);
  }
  if (u.life <= 0) { w.saucer = null; w.sauT = A.rand(10, 18); }
}
function killSaucer(pid) {
  const u = w.saucer; if (!u) return;
  if (pid >= 0) A.addScore(pid, u.small ? 1000 : 200);
  A.burst(w.parts, u.x, u.y, ['#fff'], 25, 70, .9); A.noise(.8, .25, 1500, -1200);
  w.saucer = null; w.sauT = A.rand(10, 18);
}

// ---------- Rendu vectoriel ----------
function poly(pts, x, y, ang, close = true) {
  const ctx = A.ctx, c = Math.cos(ang), s = Math.sin(ang);
  ctx.beginPath();
  pts.forEach(([px, py], k) => { const X = x + px * c - py * s, Y = y + px * s + py * c; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
  if (close) ctx.closePath(); ctx.stroke();
}
function wrapped(x, y, r, fn) {
  for (const dx of [0, -W, W]) for (const dy of [0, -H, H]) {
    if ((dx && (x + dx < -r || x + dx > W + r)) || (dy && (y + dy < -r || y + dy > H + r))) continue;
    fn(x + dx, y + dy);
  }
}
function drawSaucer(u) {
  const k = u.small ? .55 : 1, P = (pts) => pts.map(([x, y]) => [x * k, y * k]);
  poly(P([[-11, 0], [11, 0], [6, 4], [-6, 4]]), u.x, u.y, 0);
  poly(P([[-11, 0], [-6, -4], [6, -4], [11, 0]]), u.x, u.y, 0, false);
  poly(P([[-4, -4], [-2, -8], [2, -8], [4, -4]]), u.x, u.y, 0, false);
}
function draw() {
  const ctx = A.ctx;
  ctx.save(); ctx.lineWidth = .7; ctx.shadowBlur = 8; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff'; ctx.shadowColor = '#fff';
  for (const r of w.rocks) wrapped(r.x, r.y, r.r, (x, y) => poly(r.shape, x, y, r.ang));
  if (w.saucer) drawSaucer(w.saucer);
  for (const s of w.ships) {
    if (s.st !== 'ok' || (s.inv > 0 && Math.floor(w.t * 10) % 2)) continue;
    ctx.strokeStyle = ctx.shadowColor = COLS[s.pid];
    wrapped(s.x, s.y, 12, (x, y) => {
      poly(SHIP, x, y, s.ang);
      if (s.thrust && Math.floor(w.t * 30) % 2) poly([[-5, -3], [-12, 0], [-5, 3]], x, y, s.ang, false);
    });
  }
  for (const d of w.debris) {
    ctx.strokeStyle = ctx.shadowColor = d.c; ctx.globalAlpha = Math.min(1, d.l);
    const c = Math.cos(d.a), s = Math.sin(d.a);
    ctx.beginPath(); ctx.moveTo(d.x - d.dx * c + d.dy * s, d.y - d.dx * s - d.dy * c); ctx.lineTo(d.x + d.dx * c - d.dy * s, d.y + d.dx * s + d.dy * c); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const b of w.bul) { ctx.fillStyle = ctx.shadowColor = COLS[b.pid]; ctx.fillRect(b.x - .8, b.y - .8, 1.6, 1.6); }
  ctx.fillStyle = ctx.shadowColor = '#fff'; for (const b of w.sbul) ctx.fillRect(b.x - .8, b.y - .8, 1.6, 1.6);
  for (const p of w.parts) { ctx.fillStyle = '#fff'; ctx.globalAlpha = Math.min(1, p.l * 2); ctx.fillRect(p.x - .5, p.y - .5, 1, 1); }
  ctx.globalAlpha = 1;
  // vies
  ctx.lineWidth = .6;
  A.players.forEach((p, i) => {
    ctx.strokeStyle = ctx.shadowColor = COLS[i];
    for (let k = 0; k < Math.min(p.lives - 1, 6); k++) poly(SHIP.map(([x, y]) => [x * .6, y * .6]), (i ? W * .84 + 18 : W * .16 - 16) + (i ? -k : k) * 9, 24, -Math.PI / 2);
  });
  ctx.restore();
  if (w.waveT < 2 && w.rocks.length) A.text('VAGUE ' + w.wave, W / 2, H / 2 - 30, '#fff', 1, 'center');
}
let demo = null;
function attract(ctx, t, y) {
  if (!demo) { w = { wave: 1 }; demo = Array.from({ length: 6 }, () => rock(A.rand(0, W), A.rand(y, y + 50), A.irand(1, 3))); }
  ctx.save(); ctx.lineWidth = .7; ctx.shadowBlur = 8; ctx.strokeStyle = ctx.shadowColor = '#fff';
  for (const r of demo) { r.x = (r.x + r.vx * .016 + W) % W; r.y = y + 10 + ((r.y - y - 10 + r.vy * .016 + 40) % 40 + 40) % 40; r.ang += r.rot * .016; poly(r.shape, r.x, r.y, r.ang); }
  ctx.restore();
  A.text('GROS 20  MOYEN 50  PETIT 100  SOUCOUPE 200/1000', W / 2, y + 60, '#fff', 1, 'center');
}
A.run({
  id: 'asteroides', title: 'ASTEROIDES', W, H, vector: true, lives: 3, bonus: 10000, bonusEvery: 10000,
  logoColors: ['#ffffff','#f0f0f0','#e0e0e0','#d0d0d0','#c0c0c0','#b0b0b0','#909090','#202020'],
  help: () => ['J1: < > TOURNER  HAUT POUSSEE  ESPACE TIR  ALT HYPER',
               'J2: ' + A.lab('KeyD') + '/' + A.lab('KeyG') + ' TOURNER  ' + A.lab('KeyR') + ' POUSSEE  ' + A.lab('KeyA') + ' TIR  ' + A.lab('KeyS') + ' HYPER'],
  init, update, draw, attract
});
</script>
</body>
</html>
